<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaGreg Code</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/editor/editor.main.css" rel="stylesheet">
    <meta name="description" content="SigmaGreg Code">
    <meta property="og:title" content="SigmaGreg Code">
    <meta property="og:description" content="The Official SigmaGreg Code Editor.">
    <meta property="og:image" content="https://sgc.freakybob.site/assets/icon.png">
    <meta property="og:image:width" content="900">
    <meta property="og:image:height" content="auto">
    <meta property="og:url" content="https://sgc.freakybob.site/">
    <meta name="keywords" content="SigmaGreg, SigmaGreg Code, SigmaGreg Code Editor">
    <meta name="author" content="Freakybob Team">
    <link rel="icon" type="image/x-icon" href="assets/icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
body {
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
    background-color: #0f1010;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    transition: background-color 0.5s ease-in-out;
}

#sidebar {
    width: 200px;
    background-color: #371141;
    color: #16d0e4;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #00e1ff;
    transition: background-color 0.5s ease-in-out;
}

#sidebar h3 {
    margin: 0;
    padding: 10px;
    background-color: #114c7a86;
    font-size: 16px;
    text-align: center;
    transition: background-color 0.5s ease-in-out;
}

#sidebar ul {
    list-style: none;
    padding: 0;
    margin: 0;
    flex-grow: 1;
}

#sidebar ul li {
    padding: 10px;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
}

#sidebar ul li:hover {
    background-color: #65065d;
}

#menu-bar {
    height: 30px;
    background-color: #3fb1b375;
    display: flex;
    align-items: center;
    padding: 0 10px;
    color: #fff;
    flex-shrink: 0;
    transition: background-color 0.5s ease-in-out;
}

#menu-bar span {
    margin-right: 15px;
    cursor: pointer;
}

#editor-container {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    overflow: hidden;
    position: relative;
}

#editor {
    flex-grow: 1;
}

#status-bar {
    height: 24px;
    background-color: #26a74263;
    color: #d4d4d4;
    display: flex;
    align-items: center;
    padding: 0 10px;
    justify-content: space-between;
}

#status-bar span {
    font-size: 12px;
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-content {
    display: none;
    position: absolute;
    background-color: #371141;
    min-width: 160px;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
    z-index: 1;
}

.dropdown-content a {
    color: #16d0e4;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    transition: background-color 0.2s ease-in-out;
}

.dropdown-content a:hover {
    background-color: #65065d;
}

.dropdown:hover .dropdown-content {
    display: block;
}

#clock {
    pointer-events: none;
    position: absolute;
    top: 4px;
    right: 20px;
    color: #16d0e4;
    font-size: 14px;
    font-weight: bold;
}

.context-menu {
    position: absolute;
    background-color: #371141;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
    z-index: 1;
    display: none;
    min-width: 160px;
    transition: all 0.2s ease-in-out;
}

.context-menu a {
    color: #16d0e4;
    padding: 12px 16px;
    text-decoration: none;
    display: block;
    transition: all 0.2s ease-in-out;
}

.context-menu a:hover {
    background-color: #65065d;
}

#file-list .active {
    background-color: #085545;
    color: white;
}

#file-list .active:hover {
    background-color: #065a5a;
}
#errorCheckerModal, #newFileModal, #renameFileModal, #deleteFileModal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    background-color: rgba(13, 19, 73, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#errorCheckerModal .error-checker-modal-content,
#newFileModal .error-checker-modal-content,
#renameFileModal .error-checker-modal-content,
#deleteFileModal .error-checker-modal-content {
    background-color: #1e1e2d;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    width: 90%;
    max-width: 400px;
    color: #16d0e4;
    text-align: center;
}

#errorCheckerModal h2, 
#newFileModal h2, 
#renameFileModal h2,
#deleteFileModal h2 {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

#errorCheckerModal p, 
#newFileModal p, 
#renameFileModal p,
#deleteFileModal p {
    font-size: 16px;
    margin-bottom: 15px;
    color: #9ca3af;
}

#errorCheckerModal input, 
#newFileModal input, 
#renameFileModal input,
#deleteFileModal input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #3b3b54;
    background-color: #2a2a3d;
    color: #e5e7eb;
    font-size: 14px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

#errorCheckerModal button, 
#newFileModal button, 
#renameFileModal button,
#deleteFileModal button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease-in-out;
    margin: 0 5px;
}

#renameFileModal #renameFileButton,
#deleteFileModal #deleteFileButton,
#newFileModal #createNewFile {
    background-color: #16d0e4;
    color: #0f1010;
}



#renameFileModal #closeRenameFileModal {
    background-color: #6b7280;
    color: white;
}

#renameFileModal #closeRenameFileModal:hover {
    background-color: #4b5563;
}

#newFileModal #closeNewFileModal {
    background-color: #6b7280;
    color: white;
}

#newFileModal #closeNewFileModal:hover {
    background-color: #4b5563;
}
#deleteFileModal #closeDeleteFileModal {
    background-color: #6b7280;
    color: white;
}

#deleteFileModal #closeDeleteFileModal:hover {
    background-color: #4b5563;
}

#loadingCircle {
    border: 4px solid transparent;
    border-top: 4px solid #16d0e4;
    border-right: 4px solid #ff5733;
    border-bottom: 4px solid #33ff57;
    border-left: 4px solid #3357ff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1.5s linear infinite;
    margin-bottom: 15px;
    display: inline-block;
    position: relative;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}


#errorCheckerClose {
    background-color: #16d0e4;
    color: #0f1010;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
}

#errorCheckerClose:hover {
    background-color: #14b0b2;
}

    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Explorer</h3>
        <ul id="file-list"></ul>
    </div>
    <div id="editor-container">
        <div id="menu-bar">
            <span id="clock"></span>
            <div class="dropdown">
                <span>File</span>
                <div class="dropdown-content">
                    <a href="#" id="openFile">Open File</a>
                    <a href="#" id="newFile">New File</a>
                    <a href="#" id="saveFile">Save</a>
                    <a href="#" id="errorChecker">Error Checker</a>
                </div>
            </div>
            <div class="dropdown">
                <span>About</span>
                <div class="dropdown-content">
                    <a href="#" id="License" onclick="license()">License</a>
                    <a href="#" id="Credits" onclick="credits()">Credits</a>
                </div>
            </div>
        </div>
        <div id="editor"></div>
        <div id="status-bar">
            <span>Greg</span>
        </div>
    </div>

    <div class="context-menu" id="contextMenu">
        <a href="#" id="renameFile">Rename</a>
        <a href="#" id="deleteFile">Delete</a>
        <a href="#" id="downloadFile">Download</a>
    </div>

    <div class="error-checker-modal" id="errorCheckerModal">
        <div class="error-checker-modal-content">
            <h2>Error Checker</h2>
            <div id="loadingCircle"></div>
            <p id="errorCheckerMessage">Checking for errors...</p>
            <button id="errorCheckerClose">Close</button>
        </div>
    </div>
    
<div class="error-checker-modal" id="newFileModal" style="display: none;">
    <div class="error-checker-modal-content">
        <h2>New File</h2>
        <p>Enter the name for the new file:</p>
        <p id="newFileMessage"></p>
        <input type="text" id="newFileName" placeholder="File name" style="width: 90%; padding: 10px; margin-bottom: 15px;">
        <button id="createNewFile">Create</button>
        <button id="closeNewFileModal">Cancel</button>
    </div>
</div>

<div class="error-checker-modal" id="renameFileModal" style="display: none;">
    <div class="error-checker-modal-content">
        <h2>Rename File</h2>
        <p>Enter the new name for the file:</p>
        <p id="renameFileMessage"></p>
        <input type="text" id="renameFileName" placeholder="New file name" style="width: 90%; padding: 10px; margin-bottom: 15px;">
        <button id="renameFileButton">Rename</button>
        <button id="closeRenameFileModal">Cancel</button>
    </div>
</div>
<div class="error-checker-modal" id="deleteFileModal" style="display: none;">
    <div class="error-checker-modal-content">
        <h2>Delete File</h2>
        <p id="deleteFileMessage"></p>
        <button id="deleteFileButton">Delete</button>
        <button id="closeDeleteFileModal">Cancel</button>
    </div>
</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.min.js"></script>

<script src="js/about_dropdown.js"></script>
<script src="js/main.js"></script>
<script>
    if (typeof navigator.serviceWorker !== 'undefined') {
      navigator.serviceWorker.register('sw.js')
    }
</script> 

</body>
</html>
